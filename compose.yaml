services:
  postgres:
    image: postgres:17
    container_name: pedidos-estoque-db
    environment:
      POSTGRES_DB: pedidos_estoque
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pedidos_estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
